# MedTerm-KR 안드로이드 앱(APK) 만들기
# 사용: GitHub 저장소 → Actions → "android-apk" → Run workflow. 끝나면 실행 결과 맨 아래 Artifacts 의 "MedTerm-KR-apk"를 내려받는다.
# 자동으로 돌지 않는다(수동 실행만). 저장소가 비공개여도 Actions 는 쓸 수 있고, 내려받는 사람은 저장소 접근 권한이 있어야 한다.
name: android-apk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-react/package-lock.json

      - name: 화면 만들기 (web-react → dist/MedTerm-KR_app.html)
        working-directory: web-react
        run: |
          npm ci
          npm run build

      - name: 화면을 앱 안에 넣기
        run: cp web-react/dist/MedTerm-KR_app.html android-app/app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK 만들기
        working-directory: android-app
        run: ./gradlew --no-daemon assembleRelease

      - name: APK 이름 정리
        run: cp android-app/app/build/outputs/apk/release/app-release.apk MedTerm-KR.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MedTerm-KR-apk
          path: MedTerm-KR.apk
          retention-days: 14
